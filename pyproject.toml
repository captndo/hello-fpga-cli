[project]
name = "hello-fpga-cli"
version = "0.1.0"
description = "Native Linux CLI for the Microchip Hello FPGA kit PIC32 DirectC programmer"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "typer>=0.12",
]

[project.scripts]
hello-fpga = "hello_fpga_cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["hello_fpga_cli.py", "hello_fpga"]
